name: Windows installer

on:
  push:
    branches: [main]
    paths: ['install.ps1', 'tests/windows-installer.ps1', '.github/workflows/windows-installer.yml']
  pull_request:
    paths: ['install.ps1', 'tests/windows-installer.ps1', '.github/workflows/windows-installer.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-2022
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Installer safety and activation contracts
        shell: ${{ matrix.shell }}
        run: ./tests/windows-installer.ps1
