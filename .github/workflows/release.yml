name: Native release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  MACOSX_DEPLOYMENT_TARGET: '13.0'

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt --component clippy
          rustup override set 1.88.0
      - name: Verify source and transition contracts
        run: |
          cargo fmt --all --check
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --all-targets --all-features
          scripts/test-mixed-runtime.sh
          cargo fetch --locked
          scripts/generate-third-party.sh /tmp/THIRD_PARTY.md
          diff -u THIRD_PARTY.md /tmp/THIRD_PARTY.md

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
            executable: target/aarch64-apple-darwin/release/pika
          - target: x86_64-apple-darwin
            os: macos-15-intel
            executable: target/x86_64-apple-darwin/release/pika
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            executable: target/aarch64-unknown-linux-musl/release/pika
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
            executable: target/x86_64-unknown-linux-musl/release/pika
          - target: x86_64-pc-windows-msvc
            os: windows-2022
            executable: target/x86_64-pc-windows-msvc/release/pika.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.88.0 --profile minimal --target '${{ matrix.target }}'
          rustup override set 1.88.0
      - name: Install musl compiler
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - name: Build
        run: cargo build --release --locked --target '${{ matrix.target }}'
      - name: Verify host binary
        if: runner.os != 'Windows'
        run: |
          expected="${GITHUB_REF_NAME#v}"
          if [ "$GITHUB_REF_NAME" = v0.5.0a5 ]; then
            expected=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          fi
          test "$(${{ matrix.executable }} --version)" = "pika $expected"
          ${{ matrix.executable }} --help >/dev/null
          ${{ matrix.executable }} skill show >/dev/null
      - name: Verify Windows client boundary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          if ($env:GITHUB_REF_NAME -eq 'v0.5.0a5') {
            $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          }
          $expected = 'pika ' + $version
          if ((& '${{ matrix.executable }}' --version) -ne $expected) { throw 'binary version mismatch' }
          $help = (& '${{ matrix.executable }}' --help | Out-String)
          if ($help -notmatch 'Native Windows agent hosting is unsupported') { throw 'missing client-only support boundary' }
          if ($help -match '(?m)^  (list|new|ask|experts|doctor)\s') { throw 'Windows artifact exposed an agent-hosting command' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: binary-${{ matrix.target }}
          path: ${{ matrix.executable }}
          if-no-files-found: error
          retention-days: 7

  assemble:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: binary-*
          path: binaries
      - name: Assemble and verify immutable assets
        shell: bash
        run: |
          chmod +x binaries/*/pika scripts/*.sh scripts/*.pl scripts/*.py
          native_version="${GITHUB_REF_NAME#v}"
          native_output=release
          if [ "$GITHUB_REF_NAME" = v0.5.0a5 ]; then
            native_version=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
            native_output=transition-native
          fi
          PIKA_CROSS_PACKAGE=1 scripts/package-release.sh "$native_version" "$native_output" \
              aarch64-apple-darwin=binaries/binary-aarch64-apple-darwin/pika \
              x86_64-apple-darwin=binaries/binary-x86_64-apple-darwin/pika \
              aarch64-unknown-linux-musl=binaries/binary-aarch64-unknown-linux-musl/pika \
              x86_64-unknown-linux-musl=binaries/binary-x86_64-unknown-linux-musl/pika \
              x86_64-pc-windows-msvc=binaries/binary-x86_64-pc-windows-msvc/pika.exe
          release_version="${GITHUB_REF_NAME#v}"
          case "$release_version" in
            0.5.0a5)
              mkdir release
              python3 scripts/package-python-bridge.py "$release_version" "$native_version" \
                "release/pikamux-$release_version-py3-none-any.whl" \
                aarch64-apple-darwin="$native_output/pikamux-$native_version-aarch64-apple-darwin.tar.gz" \
                x86_64-apple-darwin="$native_output/pikamux-$native_version-x86_64-apple-darwin.tar.gz" \
                aarch64-unknown-linux-musl="$native_output/pikamux-$native_version-aarch64-unknown-linux-musl.tar.gz" \
                x86_64-unknown-linux-musl="$native_output/pikamux-$native_version-x86_64-unknown-linux-musl.tar.gz"
              ;;
            *[!0-9.]*|'') ;;
            *)
              python3 scripts/package-python-bridge.py "$release_version" "$native_version" \
                "release/pikamux-$release_version-py3-none-any.whl" \
                aarch64-apple-darwin="release/pikamux-$native_version-aarch64-apple-darwin.tar.gz" \
                x86_64-apple-darwin="release/pikamux-$native_version-x86_64-apple-darwin.tar.gz" \
                aarch64-unknown-linux-musl="release/pikamux-$native_version-aarch64-unknown-linux-musl.tar.gz" \
                x86_64-unknown-linux-musl="release/pikamux-$native_version-x86_64-unknown-linux-musl.tar.gz"
              ;;
          esac
          scripts/verify-release.sh release
          {
            echo '### Native release checksums'
            echo '```text'
            cat release/SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ github.ref_name }}
          path: release/
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: assemble
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-${{ github.ref_name }}
          path: release
      - name: Block unsigned macOS publication
        shell: bash
        run: |
          echo 'Release blocked: supply signed and notarized macOS artifacts and add clean-host verification before enabling publication.' >&2
          exit 1
      - name: Attest release provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: 'release/*'
      - name: Publish the exact reviewed assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          release_kind=()
          case "${GITHUB_REF_NAME#v}" in
            *a*|*b*|*rc*|*-alpha.*|*-beta.*|*-rc.*) release_kind+=(--prerelease) ;;
            *) release_kind+=(--latest) ;;
          esac
          gh release create "$GITHUB_REF_NAME" release/* --verify-tag \
            --title "Pika ${GITHUB_REF_NAME#v}" --generate-notes "${release_kind[@]}"
