name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux ncurses-term
          python -m pip install uv==0.8.15
      - run: uv sync --locked --group dev
      - run: uv run pytest -q --timeout=90
      - run: uv build --out-dir dist/candidate
      - name: Verify distribution allowlist
        env:
          PIKA_RELEASE_DIST: dist/candidate
        run: uv run pytest -q tests/test_release_contract.py --timeout=90
      - name: Verify installed wheel and sdist
        run: |
          uv venv .wheel-check
          uv pip install --python .wheel-check/bin/python dist/candidate/*.whl
          .wheel-check/bin/pika --version
          .wheel-check/bin/pika --help
          .wheel-check/bin/pika skill show
          .wheel-check/bin/pika skill install .wheel-check/skill --json
          .wheel-check/bin/python -m pikamux.monitor --demo
          uv venv .sdist-check
          uv pip install --python .sdist-check/bin/python dist/candidate/*.tar.gz
          .sdist-check/bin/pika --help
          .sdist-check/bin/pika skill show

  windows-client:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - run: python -m pip install .
      - run: pika --help
      - run: pika --version
