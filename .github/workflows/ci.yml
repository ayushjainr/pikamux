name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Install test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux ncurses-term
          python -m pip install uv==0.8.15
      - run: uv sync --locked --group dev
      - run: uv run pytest -q --timeout=90
      - run: uv run python scripts/build_release.py --output dist/candidate
      - name: Verify fresh-host install and staged update
        env:
          PIKA_INSTALL_BUNDLE: dist/candidate
          PIKA_BOOTSTRAP_BUNDLE: dist/candidate
        run: uv run pytest -q tests/test_installation.py tests/test_bootstrap.py --timeout=300
      - name: Verify distribution allowlist
        env:
          PIKA_RELEASE_DIST: dist/candidate
        run: uv run pytest -q tests/test_release_contract.py --timeout=90
      - name: Verify installed wheel and sdist
        run: |
          uv venv .wheel-check
          uv pip install --python .wheel-check/bin/python dist/candidate/*.whl
          .wheel-check/bin/pika --version
          .wheel-check/bin/pika --help
          .wheel-check/bin/pika skill show
          .wheel-check/bin/pika skill install .wheel-check/skill --json
          .wheel-check/bin/python -m pikamux.monitor --demo
          uv venv .sdist-check
          uv pip install --python .sdist-check/bin/python dist/candidate/*.tar.gz
          .sdist-check/bin/pika --help
          .sdist-check/bin/pika skill show

  macos:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install test tools
        run: |
          brew install tmux
          python -m pip install uv==0.8.15
      - run: uv sync --locked --group dev
      - run: uv run pytest -q --timeout=90
      - run: uv run python scripts/build_release.py --output dist/candidate
      - name: Verify fresh-host install and staged update
        env:
          PIKA_INSTALL_BUNDLE: dist/candidate
          PIKA_BOOTSTRAP_BUNDLE: dist/candidate
        run: uv run pytest -q tests/test_installation.py tests/test_bootstrap.py --timeout=300
      - name: Verify distribution allowlist
        env:
          PIKA_RELEASE_DIST: dist/candidate
        run: uv run pytest -q tests/test_release_contract.py --timeout=90
      - name: Verify clean installed package
        run: |
          uv venv .wheel-check
          uv pip install --python .wheel-check/bin/python dist/candidate/*.whl
          .wheel-check/bin/pika --version
          .wheel-check/bin/pika --help
          .wheel-check/bin/python -c 'from pikamux.processes import process_start_time; import os; assert process_start_time(os.getpid())'
          .wheel-check/bin/python -m pikamux.monitor --demo

  windows-client:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install .
      - run: pika --help
      - run: pika --version
