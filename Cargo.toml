[package]
name = "pikamux"
version = "0.6.2"
edition = "2024"
rust-version = "1.88"
description = "One native home for coding agents"
license = "MIT"
repository = "https://github.com/ayushjainr/pikamux"

[[bin]]
name = "pika"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
directories = "6.0"
fs2 = "0.4"
libc = "0.2"
regex = "1.11"
rusqlite = { version = "0.37", features = ["bundled", "hooks"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
shell-words = "1.1"
signal-hook = "0.3"
thiserror = "2.0"
time = { version = "0.3", features = ["parsing"] }
toml_edit = "0.23"
unicode-width = "0.2"
uuid = { version = "1.18", features = ["v4"] }
walkdir = "2.5"

[target.'cfg(target_os = "macos")'.dependencies]
libproc = "0.14"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.21"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "z"
panic = "abort"
strip = "symbols"
