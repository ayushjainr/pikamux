<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pika — experience across projects</title>
<style>
:root{color-scheme:dark;--paper:#eeedf5;--muted:#aaa6bd;--coral:#ff928b;--mint:#a1e2cd;--blue:#9eb9ff}
*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#11111c;color:var(--paper);font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;overflow:hidden;transform-origin:center;background:radial-gradient(ellipse at 85% 10%,#35304755,transparent 65%),#1c1b2c}
.brand{position:absolute;top:56px;left:88px;display:flex;align-items:center;gap:17px;font-size:23px;font-weight:650;letter-spacing:3px}.mark{width:23px;height:23px;background:var(--coral);border-radius:5px;transform:rotate(-12deg)}
.edition{position:absolute;right:88px;top:60px;font:16px Menlo,monospace;letter-spacing:1px;color:var(--muted)}
#scene{position:absolute;inset:135px 100px 100px}.label{font:17px/1.5 Menlo,monospace;text-transform:uppercase;letter-spacing:1.7px;color:var(--muted)}
h1,h2,h3,p{margin:0}h1{font-size:82px;line-height:1.09;letter-spacing:-3.8px;font-weight:600}h2{font-size:58px;line-height:1.15;letter-spacing:-2.3px;font-weight:550}h3{font-size:37px;line-height:1.2;font-weight:550;letter-spacing:-1px}
.accent{color:var(--coral)}.mint{color:var(--mint)}.blue{color:var(--blue)}.muted{color:var(--muted)}
.title{margin:21px 0 42px}.row{display:grid;grid-template-columns:1fr 1fr;gap:44px}.panel{padding:35px 38px;border:1px solid #655b7766;border-radius:17px;background:#292537;box-shadow:0 22px 70px #08061444}
.panel h3{margin:20px 0 22px}.panel p{font-size:28px;line-height:1.48}.code{margin-top:24px;padding:22px 24px;background:#1e1b2b;border-radius:9px;font:25px/1.65 Menlo,monospace;white-space:pre-wrap;overflow-wrap:anywhere}
.task{margin:26px 0 37px;border-left:3px solid var(--coral);padding:16px 28px;font-size:43px;line-height:1.3}.work{font:25px/2 Menlo,monospace;color:var(--muted)}.work span{color:var(--mint)}
.quote{font-size:42px;line-height:1.43;letter-spacing:-.7px}.quote-panel{padding:44px 50px;max-width:1650px;margin-top:34px}.quote-panel .label{margin-bottom:25px}.quote-panel .reference{font:20px/1.6 Menlo,monospace;color:var(--mint);margin-top:27px}
.topic{font:22px/1.65 Menlo,monospace;color:var(--mint);margin-top:26px}.scope{margin-top:22px}.note{position:absolute;left:100px;bottom:48px;right:100px;font:16px/1.5 Menlo,monospace;color:var(--muted)}
.result-layout{display:grid;grid-template-columns:490px 1fr;gap:45px;margin-top:32px}.result-layout .panel{padding:29px}.result-layout img{width:100%;height:484px;object-fit:contain;object-position:top;background:#191724;border:1px solid #655b7766;border-radius:14px}.result-layout .code{font-size:22px}.result-layout p{font-size:26px;line-height:1.5;margin-top:26px}
.close{padding:62px 32px}.close p{font-size:34px;line-height:1.5;color:var(--muted);margin-top:38px}.repo{font:29px Menlo,monospace;color:var(--mint);margin-top:44px;display:block;text-decoration:none}.caveat{font:17px/1.7 Menlo,monospace;color:var(--muted);margin-top:35px}
.progress{position:absolute;bottom:0;left:0;height:3px;background:var(--coral)}#controls{position:fixed;bottom:10px;left:15%;width:70%;display:flex;gap:16px;padding:12px;background:#111d;opacity:0;z-index:3}body:hover #controls{opacity:1}#controls input{flex:1}button{background:#333044;border:1px solid #777;color:var(--paper);padding:7px 15px;border-radius:5px}
.shared{display:inline-block;margin-top:24px;padding:10px 14px;border:1px solid #9eb9ff44;border-radius:8px;font:19px Menlo,monospace;color:var(--blue)}
.artifact{display:inline-block;margin-right:12px;padding:12px 18px;border:1px solid #a1e2cd44;border-radius:8px;font:22px Menlo,monospace;color:var(--mint)}
.dashboard{padding:30px 36px;border:1px solid #655b7766;border-radius:17px;background:#252234;min-height:480px}.dashboard h3{font-size:31px;margin:14px 0 30px}.metrics{display:flex;gap:40px;border-bottom:1px solid #655b7755;padding-bottom:23px;margin-bottom:25px}.metrics strong{font-size:42px;font-weight:500;display:block;margin-top:10px}.bars{display:grid;grid-template-columns:110px 1fr 50px;gap:21px 18px;align-items:center;font:20px Menlo,monospace}.track{height:23px;background:#a1e2cd11;border-radius:4px;overflow:hidden}.fill{height:100%;background:var(--mint);transform-origin:left;border-radius:4px}.agent-note{font-size:30px;line-height:1.4;margin-top:32px;max-width:1570px;color:var(--muted)}
</style></head><body>
<main id="stage"><div class="brand"><i class="mark"></i>PIKA</div><div class="edition">ILLUSTRATIVE DEMO · DEVELOPMENT PREVIEW</div><section id="scene"></section><div class="note" id="note"></div><div class="progress" id="progress"></div></main>
<div id="controls"><button id="play">Pause</button><input id="seek" aria-label="Video timeline" type="range" min="0" max="60" step="0.05"><span id="time"></span></div>
<script src="cross-project.js"></script><script>
window.PIKA_FILM={seconds:60,stills:[2,7,9,16,25,36,47,56],basename:'pika-cross-project.mp4'};
const E=PIKA_CROSS_PROJECT,scene=document.getElementById('scene'),esc=s=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');
const card=()=>`<div class="panel" id="expert-card"><div class="label mint">Pika · expert card</div><h3>${esc(E.expertName)}</h3><p>${esc(E.scopeExcerpt)}</p><div class="topic">${E.topics.map(esc).join('<br>')}</div><div class="shared">Also uses the Activity service</div></div>`;
const screens=[
()=>`<div class="label">Project / Operations dashboard</div><h1 class="title">The agent gets to work.</h1><div class="row"><div class="panel"><div class="label">You → dashboard agent</div><div class="task">${esc(E.task)}</div><div class="work" id="work">Reading the client reference<br>Connecting the data service<br><span>Testing the first request</span></div></div><div class="panel" id="first-request"><div class="label">Activity service</div><div class="code">POST /token<br><span class="mint">200 OK</span><br><br>GET /activity/weekly<br><span class="muted">Waiting for response…</span></div></div></div>`,
()=>`<div class="label">Project / Operations dashboard</div><h1 class="title">A token was issued.<br><span class="accent">Data access was denied.</span></h1><div class="row"><div class="panel"><div class="label">Connection check</div><div class="code"><span class="mint">POST /token → 200</span><br><span class="accent">GET /activity/weekly → 403</span></div><p style="margin-top:28px">The request matches the docs.<br>Has another project used this service?</p></div><div id="early-card">${card()}</div></div>`,
()=>`<div class="label">Dashboard agent / Pika discovery</div><h1 class="title">A different project.<br><span class="accent">The same data service.</span></h1><div class="row"><div class="panel"><div class="label">Agent searches expert cards</div><div class="code mint">${esc(E.searchCommand)}</div><p style="margin-top:32px">The report exporter’s card describes<br>the integration this agent needs.</p><div class="topic muted">Metadata search · no model call</div></div>${card()}</div>`,
()=>`<div class="label">Dashboard agent → report exporter agent</div><h2 class="title">A question about the setup.</h2><div class="panel quote-panel"><div class="label">Private consultation / Dashboard agent</div><div class="quote">“${esc(E.question)}”</div></div><p class="agent-note">The question goes to the conversation that built the exporter.</p>`,
()=>`<div class="label">Report exporter agent → dashboard agent</div><h2 class="title">The detail the docs missed.</h2><div class="panel quote-panel"><div class="label mint">Private consultation / Report exporter agent</div><div class="quote">“${esc(E.answer)}”</div><div class="reference">${E.artifacts.map(a=>`<span class="artifact">${esc(a)}</span>`).join('')}</div></div>`,
()=>`<div class="label">Project / Operations dashboard</div><h2 class="title">Back to the dashboard.</h2><div class="result-layout"><div class="panel"><div class="label mint">Dashboard agent</div><p style="margin-top:24px">“I’ll check that setup and request a separate data token.”</p><div class="code" id="passed"><span class="mint">Data connection: passed</span><br>Weekly activity: loaded</div><div class="topic">Consultation closed.</div></div><div class="dashboard"><div class="label">Operations / Activity</div><h3>Weekly activity</h3><div class="metrics"><div><span class="label">Total events</span><strong>293</strong></div><div><span class="label">Latest week</span><strong>97</strong></div></div><div class="bars">${E.weeks.map(w=>`<span>${esc(w.label)}</span><div class="track"><div class="fill" style="width:${w.events/112*100}%"></div></div><span>${w.events}</span>`).join('')}</div></div></div>`,
()=>`<div class="close"><div class="label">Pika</div><h1 class="title">Find relevant experience<br><span class="accent">across your projects.</span></h1><p>Your agent discovers expert cards and privately asks<br>the conversations behind them—when it needs the context.</p><a class="repo" href="https://github.com/ayushjainr/pikamux">github.com/ayushjainr/pikamux ↗</a><div class="caveat">macOS + Linux · Development preview<br>Ayush Jain · ayushjainr.com</div></div>`
];
const cuts=[0,6,12,20,31,43,52,60];
const notes=[
'',
'',
'Expert cards describe prior work. The agent chooses whom to ask.',
'A separate consultation; the original conversation is not resumed.',
'',
'',
'Illustrative story and interfaces. Not a live screen recording.'
];
let last=-1;
window.renderFrame=function(t){t=Math.max(0,Math.min(59.999,t));const n=cuts.findIndex((v,i)=>t>=v&&t<cuts[i+1]);if(n!==last){scene.innerHTML=screens[n]();document.getElementById('note').textContent=notes[n];last=n;}const local=t-cuts[n],length=cuts[n+1]-cuts[n],ease=x=>1-(1-Math.max(0,Math.min(1,x)))**3;scene.style.opacity=Math.min(1,local/.3,(length-local)/.25);scene.style.transform=`translateY(${(1-ease(local/.5))*12}px)`;if(n===0){document.getElementById('work').style.opacity=ease((local-.8)/.5);document.getElementById('first-request').style.opacity=ease((local-2)/.7);}if(n===1){const el=document.getElementById('early-card');el.style.opacity=ease((local-1.4)/.5);el.style.transform=`translateX(${(1-ease((local-1.4)/.6))*22}px)`;}if(n===5){document.getElementById('passed').style.opacity=ease((local-1)/.6);document.querySelectorAll('.fill').forEach((el,i)=>el.style.transform=`scaleX(${ease((local-1.5-i*.15)/1)})`);}document.getElementById('progress').style.width=t/60*1920+'px';document.getElementById('seek').value=t;document.getElementById('time').textContent=Math.floor(t)+' / 60s';return n;};
function resize(){document.getElementById('stage').style.transform=`translate(-50%,-50%) scale(${Math.min(innerWidth/1920,innerHeight/1080)})`;}addEventListener('resize',resize);resize();
const params=new URLSearchParams(location.search);let position=Number(params.get('t')||0),playing=!params.has('t'),previous=performance.now();if(params.has('render')){playing=false;document.getElementById('controls').style.display='none';}window.renderFrame(position);
function tick(now){if(playing){position=(position+(now-previous)/1000)%60;window.renderFrame(position);}previous=now;requestAnimationFrame(tick);}requestAnimationFrame(tick);
document.getElementById('play').onclick=()=>{playing=!playing;document.getElementById('play').textContent=playing?'Pause':'Play';};document.getElementById('seek').oninput=e=>{position=Number(e.target.value);playing=false;window.renderFrame(position);};addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();playing=!playing;}if(e.code==='ArrowRight'||e.code==='ArrowLeft'){e.preventDefault();position=Math.max(0,Math.min(59.9,position+(e.code==='ArrowRight'?5:-5)));playing=false;window.renderFrame(position);}});
</script></body></html>
