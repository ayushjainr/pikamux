<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pika — an expert network for your agents</title>
<style>
:root{color-scheme:dark;--paper:#eeedf5;--muted:#a2a0b8;--coral:#ff928b;--mint:#a1e2cd;--blue:#9eb9ff}
*{box-sizing:border-box}body{margin:0;background:#11111c;color:var(--paper);font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif;overflow:hidden}
#stage{width:1920px;height:1080px;position:absolute;left:50%;top:50%;transform-origin:center;overflow:hidden;background:radial-gradient(ellipse at 80% 20%,#35304755,transparent 55%),#1c1b2c}
.grid{position:absolute;inset:0;background-image:linear-gradient(#ffffff04 1px,transparent 1px),linear-gradient(90deg,#ffffff04 1px,transparent 1px);background-size:80px 80px;mask-image:linear-gradient(transparent,#000,transparent)}
.brand{position:absolute;left:88px;top:57px;display:flex;align-items:center;gap:15px;font-size:23px;font-weight:650;letter-spacing:3px}.mark{width:24px;height:24px;background:var(--coral);border-radius:5px;transform:rotate(-12deg);box-shadow:9px 9px 0 -4px #ff928b33}
.edition{position:absolute;right:88px;top:62px;font:16px Menlo,monospace;color:var(--muted);letter-spacing:1.5px}
#scene{position:absolute;inset:0}.eyebrow{font:18px Menlo,monospace;color:var(--coral);letter-spacing:3px;text-transform:uppercase;margin-bottom:24px}
h1,h2,p{margin:0}h1{font-size:108px;line-height:1.04;font-weight:620;letter-spacing:-5.5px}h2{font-size:66px;line-height:1.1;letter-spacing:-2.8px;font-weight:600}.muted{color:var(--muted)}.accent{color:var(--coral)}.mint{color:var(--mint)}.blue{color:var(--blue)}
.hero{position:absolute;left:132px;top:270px}.hero p{font-size:30px;line-height:1.5;margin-top:35px;color:var(--muted)}
.floaters{position:absolute;left:1120px;top:255px;width:635px}.mini{padding:28px 32px;border:1px solid #66607766;border-radius:15px;background:#282638;box-shadow:0 24px 80px #05040d55;margin-bottom:28px;font:23px Menlo,monospace;transform:translateX(var(--dx,0))}.mini .bar{font:14px Menlo,monospace;color:var(--muted);margin-bottom:28px;text-transform:uppercase;letter-spacing:2px}.mini span{color:var(--mint)}
.section-head{position:absolute;left:88px;top:142px}.section-head h2{font-size:57px}.kicker{position:absolute;right:88px;top:174px;font:16px Menlo,monospace;color:var(--muted)}
.terminal{position:absolute;left:88px;top:282px;width:1744px;height:676px;background:#252337;border:1px solid #4d475e;border-radius:16px;box-shadow:0 35px 110px #0b091b77;overflow:hidden}
.terminal-top{height:49px;border-bottom:1px solid #ffffff0d;padding:16px 24px;font:14px Menlo,monospace;color:#a6a0b9;display:flex;justify-content:space-between;align-items:center}.dots{display:flex;gap:8px}.dots i{width:9px;height:9px;background:#5a536d;border-radius:50%}.terminal-top .name{position:absolute;left:50%;transform:translateX(-50%)}
.terminal pre{margin:19px 28px;font:22px/23.2px Menlo,monospace;white-space:pre;letter-spacing:-.2px;color:#dedbec}.under-caption{position:absolute;left:88px;bottom:61px;font-size:23px;color:var(--muted)}.under-caption strong{color:var(--paper);font-weight:500}
.command-box{position:absolute;left:132px;top:522px;width:1656px;background:#242235;border:1px solid #59516b;border-radius:15px;padding:44px;font:64px Menlo,monospace;box-shadow:0 30px 100px #0003}.cursor{display:inline-block;width:27px;height:68px;background:var(--coral);vertical-align:-12px;margin-left:5px}
.providers{position:absolute;left:138px;top:760px;display:flex;gap:50px;color:var(--muted);font:22px Menlo,monospace}.providers span:before{content:'◆';color:var(--mint);font-size:14px;margin-right:15px}
.pill{padding:10px 17px;border:1px solid #a1e2cd44;background:#a1e2cd0b;border-radius:30px;font:16px Menlo,monospace;color:var(--mint)}
.focus{position:absolute;left:112px;top:375px;width:504px;height:51px;border:2px solid #ff928baa;border-radius:6px;pointer-events:none}
.callout{position:absolute;left:140px;bottom:210px;max-width:420px;background:#322d43;border:1px solid #7b657c;padding:20px 28px;border-radius:12px;font-size:24px;box-shadow:0 20px 65px #0005}.callout .small{display:block;font:14px Menlo,monospace;color:var(--muted);margin-top:9px}
.ask-layout{position:absolute;left:100px;top:222px;width:1720px;display:grid;grid-template-columns:590px 1fr;gap:88px}.ask-intro{padding-top:70px}.ask-intro h1{font-size:88px;letter-spacing:-4px}.ask-intro p{font-size:27px;line-height:1.45;color:var(--muted);margin-top:32px;max-width:520px}
.answer-card{border:1px solid #625772;border-radius:19px;background:#282437;box-shadow:0 30px 100px #0004;min-height:624px;padding:36px}.answer-label{font:15px Menlo,monospace;letter-spacing:1.5px;color:var(--muted);display:flex;justify-content:space-between}.question{margin-top:30px;padding:24px;background:#ffffff08;border-left:3px solid var(--coral);font-size:28px;line-height:1.4}.answer{font-size:30px;line-height:1.54;padding-top:31px;letter-spacing:-.4px}.answer-meta{margin-top:30px;font:15px Menlo,monospace;color:var(--mint)}
.route{position:absolute;left:132px;top:474px;display:flex;align-items:center;gap:44px}.node{width:444px;height:222px;padding:35px;border:1px solid #59546b;border-radius:18px;background:#282437}.node-label{font:15px Menlo,monospace;color:var(--muted);letter-spacing:2px}.node h3{font-size:35px;font-weight:500;letter-spacing:-1px;margin:23px 0}.node p{font:17px Menlo,monospace;color:var(--mint)}.arrow{font:40px Menlo,monospace;color:var(--coral)}
.evidence{position:absolute;left:133px;top:775px;display:flex;gap:20px}.evidence .pill{padding:18px 24px}.fine{position:absolute;left:134px;bottom:100px;font:17px Menlo,monospace;color:var(--muted)}
.three{display:flex;gap:30px;margin-top:58px}.three div{border-top:1px solid #655b77;padding-top:22px;width:440px;font-size:25px}.three small{display:block;color:var(--muted);font:17px Menlo,monospace;margin-top:14px}
.closing{position:absolute;left:132px;top:204px}.closing h1{font-size:124px}.closing p{font-size:33px;color:var(--muted);margin-top:25px}.repo{display:block;font:29px Menlo,monospace;color:var(--mint);text-decoration:none;margin-top:46px}.install{margin-top:46px;padding:27px 30px;background:#252235;border:1px solid #5e526e;border-radius:12px;width:1656px;font:21px/1.65 Menlo,monospace;white-space:pre-wrap;overflow-wrap:anywhere}.closing .note{font:17px Menlo,monospace;color:var(--muted);margin-top:24px}
.progress{position:absolute;left:0;bottom:0;height:3px;background:var(--coral);opacity:.65}#controls{position:fixed;bottom:10px;left:15%;width:70%;opacity:0;transition:opacity .2s;background:#111b;padding:12px;display:flex;gap:15px;z-index:10}body:hover #controls{opacity:1}#controls input{flex:1}button{background:#333044;color:white;border:1px solid #777;padding:6px 14px;border-radius:5px}
.hook-task{position:absolute;left:132px;top:375px;width:650px}.search-line{font:22px/1.6 Menlo,monospace;color:var(--muted);margin-top:32px}.hook-match{position:absolute;left:930px;top:310px;width:850px;padding:36px;border:1px solid #73637e;border-radius:18px;background:#282437}.hook-match h3,.expert-card h3{font-size:40px;margin:24px 0;font-weight:550}.scope{font-size:31px;line-height:1.4;margin:18px 0 25px}.card-meta{font:15px/1.5 Menlo,monospace;color:var(--muted);letter-spacing:.4px}.hook-payoff{position:absolute;left:132px;top:780px;font-size:42px;line-height:1.15;letter-spacing:-1px}.discovery-layout{position:absolute;left:100px;top:310px;width:1720px;display:grid;grid-template-columns:700px 930px;gap:90px}.search-panel{padding:35px 0}.search-command{font:25px Menlo,monospace;color:var(--mint);margin:28px 0 52px;padding:25px 20px;background:#282437;border:1px solid #625772;border-radius:10px}.search-panel p{font-size:28px;line-height:1.5;color:var(--muted);margin:28px 0}.expert-card{padding:32px 36px;border:1px solid #73637e;border-radius:18px;background:#282437}.expert-card .scope{font-size:28px}.card-topics{font-size:25px;line-height:1.5;margin:12px 0 24px;color:var(--mint)}.card-artifacts{font:20px Menlo,monospace;margin:14px 0 26px}.card-foot{padding-top:20px;border-top:1px solid #59546b;font:17px/1.6 Menlo,monospace;color:var(--muted)}.decision-card{margin-top:40px;padding:32px 40px;border:1px solid #73637e;border-radius:18px;background:#282437;width:1530px}.decision-card h2{font-size:48px;margin-top:22px}.decision-card p{font-size:27px;line-height:1.5;margin:20px 0 24px}.closing .three small{line-height:1.5}
</style></head>
<body><main id="stage"><div class="grid"></div><div class="brand"><i class="mark"></i>PIKA</div><div class="edition">YOUR AGENTS. AN EXPERT NETWORK.</div><section id="scene"></section><div class="progress" id="progress"></div></main>
<div id="controls"><button id="play">Pause</button><input id="seek" aria-label="Video timeline" type="range" min="0" max="72" step="0.05"><span id="time"></span></div>
<script src="board.js"></script><script src="consultation.js"></script><script src="discovery.js"></script><script>
const DURATION=72, scene=document.getElementById('scene');let lastScene=-1;
const esc=s=>s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');
function ansi(s){let style={},html='',last=0;const codes={30:'#272337',31:'#ff928b',32:'#a1e2cd',33:'#e8cb8f',34:'#9eb9ff',35:'#c6a4ef',36:'#8bd6e3',37:'#dedbec',90:'#aaa2bb'};for(const m of s.matchAll(/\x1b\[([0-9;]*)m/g)){const txt=s.slice(last,m.index);html+=`<span style="${Object.entries(style).map(([k,v])=>k+':'+v).join(';')}">${esc(txt)}</span>`;for(const c of (m[1]||'0').split(';').map(Number)){if(c===0)style={};else if(codes[c])style.color=codes[c];else if(c===1)style['font-weight']='700';else if(c===2)style.opacity='.72';else if(c===7)style['background-color']='#494158';}last=m.index+m[0].length;}return html+esc(s.slice(last));}
function terminal(key){return `<div class="terminal"><div class="terminal-top"><span class="dots"><i></i><i></i><i></i></span><span class="name">pika</span><span>REAL RENDERER · SYNTHETIC PROJECTS</span></div><pre>${ansi(PIKA_BOARD.frames[key])}</pre></div>`;}
const screens=[
()=>`<div class="section-head"><div class="eyebrow">A task for your agent. Expertise from another.</div><h2>You give the task. <span class="accent">Your agent finds who knows.</span></h2></div><div class="hook-task"><div class="node-label">YOU → YOUR CURRENT AGENT</div><div class="question" style="font-size:40px">Let support staff edit orders.</div><div id="hook-search" class="search-line">Agent searches Pika’s expert cards:<br><span class="mint">orders</span></div></div><div class="hook-match" id="hook-match"><div class="answer-label"><span>EXPERT CARD FOUND</span><span class="mint">CODEX · PARKED</span></div><h3>${esc(PIKA_DISCOVERY.name)}</h3><p class="scope">“${esc(PIKA_DISCOVERY.scopeExcerpt)}”</p><div class="card-meta">SCOPE EXCERPT · DESIGN.md · INTERVIEWED PROFILE</div><div id="hook-reply"><div class="card-meta" style="margin-top:35px">YOUR AGENT CONSULTS → EXPERT REPLIES</div><div class="question" style="font-size:32px">“…billing owns mutations and their audit trail.”</div></div></div><div class="hook-payoff" id="hook-payoff">Your agent found someone<br><span class="accent">who already knew.</span></div><div class="under-caption">Illustrated task · recorded discovery + answer · synthetic project · timing compressed</div>`,
()=>`<div class="hero" style="top:220px"><div class="eyebrow">This is Pika.</div><h1>Your agents.<br><span class="accent">An expert network.</span></h1><p>The agent-convo skill lets your agent discover expertise,<br>consult the conversation that earned it, and use the answer.</p><div class="three"><div>Expert cards.<small>Who knows what</small></div><div>Discovery.<small>Who is relevant to this task</small></div><div>Private consultation.<small>Ask with inherited context</small></div></div></div>`,
()=>`<div class="section-head"><div class="eyebrow">01 / Your agent discovers expertise</div><h2>An expert card. <span class="accent">A reason to ask.</span></h2></div><div class="discovery-layout"><div class="search-panel"><div class="node-label">YOUR AGENT · USING AGENT-CONVO</div><div class="search-command">pika experts orders --json</div><h2 style="font-size:48px">Search what they know.<br><span class="accent">Not just what they’re called.</span></h2><p>Scope. Topics. Artifacts.<br>A parked conversation can still be the right expert.</p><div class="card-meta">METADATA LOOKUP · NO MODEL CALL FOR SEARCH</div></div><div class="expert-card"><div class="answer-label"><span>EXPERT CARD · ACTUAL METADATA</span><span class="mint">CODEX · PARKED</span></div><h3>${esc(PIKA_DISCOVERY.name)}</h3><div class="card-meta">DURABLE SCOPE · EXCERPT</div><p class="scope">“${esc(PIKA_DISCOVERY.scopeExcerpt)}”</p><div class="card-meta">RELEVANT TOPICS · SELECTED</div><p class="card-topics">${PIKA_DISCOVERY.topics.map(esc).join('<br>')}</p><div class="card-meta">ARTIFACTS</div><p class="card-artifacts">${PIKA_DISCOVERY.artifacts.map(esc).join(' · ')}</p><div class="card-foot">Matched on scope + name · source available<br>Profile from expert interview · current at capture</div></div></div><div class="under-caption">Designed view of real Pika search output · synthetic project · card creation can spend quota; search does not</div>`,
()=>`<div class="ask-layout"><div class="ask-intro"><div class="eyebrow">02 / Your agent consults the expert</div><h1 style="font-size:78px">Your agent asks.<br><span class="accent">The expert<br>answers.</span></h1><p>The selected card leads to its exact conversation.<br><br>No copy-paste relay through you.</p></div><div class="answer-card"><div class="answer-label"><span>CURRENT AGENT → DEMO-ORDERS</span><span class="mint">PIKA SIDE</span></div><div class="question" style="font-size:26px">${esc(PIKA_CONSULTATION.question)}</div><div class="answer" id="answer" style="font-size:28px">“${esc(PIKA_CONSULTATION.answer)}”</div><div class="answer-meta" id="answer-meta">ACTUAL ANSWER · PRIVATE ARTIFACT PATH REMOVED</div></div></div><div class="under-caption">Recorded local Pika exchange · synthetic project · development build · waiting omitted</div>`,
()=>`<div class="hero" style="top:190px"><div class="eyebrow">03 / Your agent carries the context forward</div><h1 style="font-size:94px">The answer informs<br><span class="accent">the next decision.</span></h1><div class="decision-card"><div class="node-label">CURRENT AGENT · PROPOSED APPROACH</div><h2>Route edits through billing.</h2><p>Preserve one owner for changes and their audit trail.<br>Define authorization, validation and retry behavior before implementation.</p><div class="card-meta">EXPERT ANSWER CHECKED AGAINST DESIGN.md</div></div></div><div class="under-caption">An evidence-informed proposal, not a shipped feature. <strong>The demonstration did not change the endpoint.</strong></div>`,
()=>`<div class="hero" style="top:220px"><div class="eyebrow">The consultation is separate from the original.</div><h1 style="font-size:94px">Context shared.<br><span class="accent">Original conversation intact.</span></h1><div class="three"><div>Parent transcript unchanged.<small>Before / after SHA-256 matched</small></div><div>Demo files unchanged.<small>Before / after file manifest matched</small></div><div>Side discarded.<small>Cleanup confirmed by Pika</small></div></div><p style="font-size:24px">Measured in this run, with a parked parent.<br>Not a universal guarantee or a demonstration of simultaneous coding.</p></div>`,
()=>`<div class="section-head"><div class="eyebrow">For you: a board into the same network.</div><h2>See their expertise. <span class="accent">Know who needs you.</span></h2></div>${terminal('overview')}<div class="focus" id="focus"></div><div class="callout"></div><div class="under-caption">Cards explain expertise and current work. <strong>Provider signals establish attention.</strong> Type pika to look in.</div>`,
()=>`<div class="closing"><div class="eyebrow">Pika · open source · independent · local-first</div><h1 style="font-size:100px">Give your agent<br><span class="accent">an expert network.</span></h1><p>Install Pika + its agent-convo skill.<br>Start with one conversation.</p><a class="repo" href="https://github.com/ayushjainr/pikamux">github.com/ayushjainr/pikamux ↗</a><div class="three" style="margin-top:32px"><div>Codex · Claude · OpenCode<small>Your existing conversations</small></div><div>Local + trusted machines<small>Remote Codex + Claude consultations tested separately</small></div></div><div class="note">Public alpha · macOS + Linux · Accept setup to include the skill.<br>Native Windows hosting is not supported yet. Review installer instructions before running.</div></div>`
];
const cuts=[0,10,16,28,40,49,57,64,72];
window.renderFrame=function(t){
 t=Math.max(0,Math.min(71.999,t));let n=cuts.findIndex((v,i)=>t>=v&&t<cuts[i+1]);if(n<0)n=7;
 if(n!==lastScene){scene.innerHTML=screens[n]();lastScene=n;}
 const local=t-cuts[n],length=cuts[n+1]-cuts[n],ease=x=>{x=Math.min(1,Math.max(0,x));return 1-(1-x)**3;};
 scene.style.opacity=Math.max(0,Math.min(1,local/.55,(length-local)/.4));
 scene.style.transform=`translateY(${(1-ease(local/.8))*16}px)`;
 if(n===0){for(const [id,start] of [['hook-search',1.6],['hook-match',3],['hook-reply',6],['hook-payoff',7]]){const el=document.getElementById(id),p=ease((local-start)/.6);el.style.opacity=p;el.style.translate=`0 ${(1-p)*14}px`;}}
 if(n===6){
  const focus=document.getElementById('focus'),p=ease((local-3.5)/.6),key=local>3.8?'result':'overview',pre=document.querySelector('.terminal pre');
  focus.style.opacity=ease((local-1)/.4);focus.style.top=(375+46.4*p)+'px';
  if(pre.dataset.frame!==key){pre.innerHTML=ansi(PIKA_BOARD.frames[key]);pre.dataset.frame=key;}
  document.querySelector('.callout').innerHTML=local>3.8?'This result can wait.<span class="small">Ready when you are.</span>':'This needs a decision.<span class="small">Waiting for your permission.</span>';
 }
 if(n===3){document.getElementById('answer').style.opacity=ease((local-1)/.8);document.getElementById('answer-meta').style.opacity=ease((local-1.5)/.8);}
 document.getElementById('progress').style.width=(t/DURATION*1920)+'px';document.getElementById('seek').value=t;document.getElementById('time').textContent=Math.floor(t)+' / 72s';return n;
};
function resize(){document.getElementById('stage').style.transform=`translate(-50%,-50%) scale(${Math.min(innerWidth/1920,innerHeight/1080)})`;}addEventListener('resize',resize);resize();
const params=new URLSearchParams(location.search);let position=Number(params.get('t')||0),playing=!params.has('t'),previous=performance.now();if(params.has('render')){playing=false;document.getElementById('controls').style.display='none';}window.renderFrame(position);function tick(now){if(playing){position=(position+(now-previous)/1000)%DURATION;window.renderFrame(position);}previous=now;requestAnimationFrame(tick);}requestAnimationFrame(tick);document.getElementById('play').onclick=()=>{playing=!playing;document.getElementById('play').textContent=playing?'Pause':'Play';};document.getElementById('seek').oninput=e=>{position=Number(e.target.value);playing=false;window.renderFrame(position);};addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();playing=!playing;}if(e.code==='ArrowRight'||e.code==='ArrowLeft'){position=Math.max(0,Math.min(71.9,position+(e.code==='ArrowRight'?5:-5)));playing=false;window.renderFrame(position);}});
</script></body></html>
