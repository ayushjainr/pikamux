<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pika — your agents' experience, connected</title>
<style>
:root{color-scheme:dark;--bg:#1c1b2c;--panel:#282538;--line:#494258;--ink:#eeedf5;--muted:#aba6bd;--coral:#ff928b;--mint:#a1e2cd;--blue:#a6bcff}
*{box-sizing:border-box}body{margin:0;background:#11111c;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif;overflow:hidden}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center;overflow:hidden;background:radial-gradient(ellipse at 90% 5%,#49405444,transparent 65%),var(--bg)}
.brand{position:absolute;top:50px;left:88px;display:flex;align-items:center;gap:16px;font-size:24px;letter-spacing:3px;font-weight:650}.mark{width:23px;height:23px;background:var(--coral);border-radius:5px;transform:rotate(-12deg)}.edition{position:absolute;right:88px;top:56px;color:var(--muted);font:16px Menlo,monospace;letter-spacing:.8px}
#scene{position:absolute;inset:139px 100px 125px}.eyebrow,.label{font:19px/1.5 Menlo,monospace;letter-spacing:1.2px;color:var(--muted)}.eyebrow{text-transform:uppercase;font-size:17px;margin-bottom:17px}h1,h2,h3,p{margin:0}h1{font-size:80px;line-height:1.08;font-weight:580;letter-spacing:-3.5px;margin-bottom:38px}h2{font-size:43px;line-height:1.25;letter-spacing:-1.4px;font-weight:550}h3{font-size:31px;line-height:1.3;letter-spacing:-.6px;font-weight:550}.accent{color:var(--coral)}.mint{color:var(--mint)}.blue{color:var(--blue)}.muted{color:var(--muted)}
.panel{min-width:0;padding:32px 35px;border:1px solid var(--line);border-radius:15px;background:var(--panel)}.panel p{font-size:29px;line-height:1.4;margin-top:24px}.row{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:32px}.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:25px}.code{font:29px/1.6 Menlo,monospace;overflow-wrap:anywhere}.tag{font:20px Menlo,monospace;border:1px solid var(--line);border-radius:7px;padding:10px 15px;display:inline-block}.caption{font-size:30px;line-height:1.45;color:var(--muted);margin-top:31px}.status{font:21px/1.5 Menlo,monospace;color:var(--mint);margin-top:25px}.dot{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--mint);margin-right:12px}.rule{height:1px;background:var(--line);margin:25px 0}.command{font:48px/1.5 Menlo,monospace;background:#211f30;border:1px solid var(--line);border-radius:12px;padding:23px 30px}.cursor{display:inline-block;width:18px;height:40px;vertical-align:-5px;background:var(--coral);margin-left:8px}
.intro h1{font-size:94px;margin-bottom:42px}.intro .definition{font-size:37px;line-height:1.45;max-width:1250px}.providers{display:flex;gap:24px;margin-top:47px}.providers span{font-size:30px;background:var(--panel);padding:23px 33px;border:1px solid var(--line);border-radius:12px}.intro .tag{margin-top:37px}
.discovery .row{margin-top:20px}.discovery .panel{min-height:375px}.task h2{margin-top:27px}.task .status{margin-top:35px}.expert{border-color:#a1e2cd77}.expert h2{margin-top:24px}.expert .code{margin-top:26px}.search-action{margin-top:37px;color:var(--blue);font:24px Menlo,monospace}.arrow{color:var(--coral);margin-right:13px}
.consult h1{font-size:70px;margin-bottom:27px}.consult .row{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:34px}.caller{padding:0;border:0;background:transparent}.caller-head{display:flex;justify-content:space-between;align-items:center;padding:17px 23px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}.caller-head h3{font-size:28px}.caller-head span{font:20px Menlo,monospace;color:var(--muted)}.connector{height:26px;border-left:2px solid var(--blue);margin-left:40px}.side{position:relative;border:1px solid #a6bcff99;background:#28283c;border-radius:13px;padding:25px 29px;min-height:266px}.side .label{color:var(--blue);font-size:19px}.question{font-size:30px;line-height:1.4;margin-top:20px}.answer{font-size:31px;line-height:1.4;margin-top:22px;color:var(--mint)}.side-close{position:absolute;right:20px;bottom:16px;font:18px Menlo,monospace;color:var(--muted)}.continued{margin-top:20px;font-size:26px;color:var(--mint)}.original{background:#252535;min-height:418px;position:relative}.original h3{margin-top:24px}.original .code{margin-top:35px;font-size:24px}.test-row{display:flex;justify-content:space-between;margin-top:18px;color:var(--muted)}.test-row.done{color:var(--mint)}.test-row span:last-child{width:50px;text-align:right}.progress{height:5px;background:#494258;margin-top:34px;border-radius:5px;overflow:hidden}.progress div{height:100%;background:var(--mint)}.guarantee{font-size:32px;line-height:1.3;color:var(--mint);margin-top:27px}
.board-command{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.board-command .command{font-size:32px;padding:12px 22px;min-width:220px}.board-command .tag{color:var(--muted);font-size:18px}.board{padding:0;overflow:hidden}.board-bar{padding:20px 26px;display:flex;justify-content:space-between;font:19px Menlo,monospace;border-bottom:1px solid var(--line)}.board-body{display:grid;grid-template-columns:590px 1fr}.inventory{border-right:1px solid var(--line);padding:24px 20px;font:23px/1.6 Menlo,monospace}.group{font:15px Menlo,monospace;letter-spacing:1.7px;color:var(--muted);margin:14px 11px 9px}.item{padding:6px 12px;display:flex;justify-content:space-between;border-radius:5px}.item.chosen{background:#51435b}.detail{padding:31px 34px}.detail h2{font-size:36px;margin:23px 0}.detail p{font-size:30px;line-height:1.45}.detail .code{font-size:25px;line-height:1.6;margin-top:25px}.board-keys{padding:19px 28px;border-top:1px solid var(--line);font:22px Menlo,monospace}.board-keys span{color:var(--muted)}.board-keys .active{color:var(--mint)}
.recovery .row{margin-top:50px;align-items:center}.native .code{margin-top:27px;font-size:26px}.native h3{margin-top:21px}.receipt{margin-top:28px;color:var(--mint);font:20px Menlo,monospace}.machine h2{font-size:34px;margin-top:28px}.machine{min-height:240px}.routes{display:flex;align-items:center;justify-content:center;gap:30px;margin:35px 0;font:25px Menlo,monospace;color:var(--blue)}.machines h2{font-size:39px}
.setup h1{margin-bottom:34px}.steps{display:flex;flex-direction:column;gap:18px}.step{display:grid;grid-template-columns:65px 1fr;gap:22px;align-items:start;min-height:132px;padding:23px 29px}.number{font:26px Menlo,monospace;color:var(--coral);padding-top:3px}.step h3{font-size:29px}.step p{margin-top:12px;font-size:25px;color:var(--muted)}.repo{font:27px/1.5 Menlo,monospace;color:var(--mint);text-decoration:none;display:block;margin-top:32px}.finish h1{font-size:130px;margin-top:23px}.finish .repo{font-size:36px}.finish p{font-size:32px;margin:30px 0}.byline{font:20px/1.6 Menlo,monospace;color:var(--muted);margin-top:27px}.rail{position:absolute;left:100px;right:100px;bottom:75px;display:flex;gap:10px}.rail span{height:3px;background:#746a8133;flex:1}.rail .active{background:var(--coral)}#controls{position:fixed;left:15%;bottom:8px;width:70%;display:flex;gap:15px;padding:12px;background:#111e;opacity:0;z-index:5}body:hover #controls{opacity:1}#controls input{flex:1}#controls button{padding:8px 15px;background:#333044;color:var(--ink);border:1px solid var(--line);border-radius:6px}#time{font:14px Menlo,monospace;color:var(--ink);align-self:center}
</style>
</head>
<body>
<main id="stage"><div class="brand"><i class="mark"></i>PIKA</div><div class="edition">ILLUSTRATIVE DEMO · DEVELOPMENT PREVIEW</div><section id="scene"></section><div class="rail" id="rail"></div></main>
<div id="controls"><button id="play">Pause</button><input id="seek" type="range" min="0" max="60" step="0.05" aria-label="Video timeline"><span id="time"></span></div>
<script src="experience-tour.js"></script>
</body></html>
