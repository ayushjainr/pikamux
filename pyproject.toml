[build-system]
requires = ["hatchling>=1.27,<1.28"]
build-backend = "hatchling.build"

[project]
name = "pikamux"
version = "0.5.0a3"
description = "Find, recover, and consult your existing coding-agent conversations"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ayush Jain", email = "24372573+ayushjainr@users.noreply.github.com" }]
keywords = ["tmux", "codex", "claude", "opencode", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
]
dependencies = ["psutil>=7.2,<8; sys_platform == 'darwin'"]

[project.urls]
Repository = "https://github.com/ayushjainr/pikamux"
Issues = "https://github.com/ayushjainr/pikamux/issues"
Documentation = "https://github.com/ayushjainr/pikamux#readme"

[dependency-groups]
dev = ["pytest>=8.3,<10", "pytest-subtests>=0.14,<1", "pytest-timeout>=2.3,<3"]

[project.scripts]
pika = "pikamux.entrypoint:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pikamux"]

[tool.hatch.build.targets.wheel.force-include]
"install.sh" = "pikamux/install.sh"

[tool.hatch.build.targets.sdist]
include = [
  "/src/pikamux", "/tests", "/docs", "/README.md", "/LICENSE",
  "/DESIGN.md", "/CONTRIBUTING.md", "/SECURITY.md", "/CHANGELOG.md",
  "/pyproject.toml", "/uv.lock",
  "/install.sh", "/scripts",
]

[tool.hatch.build]
exclude = ["**/__pycache__", "**/*.pyc", "**/*.pika-backup*", "**/pika-skill-backup-*", "**/*.local.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
